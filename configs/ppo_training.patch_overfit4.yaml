base_ppo_config: configs/ppo_training.full_grpo.yaml

# Controlled overfit test:
# - fixed 4-patch index
# - group_size is inherited as 4 from full_grpo
# - batch_patches=16 means 4 unique patches, each repeated 4 times
# - reward keeps expression, compactness, stop, and shape terms so patch
#   training can test the same train/eval patches under the target reward
base_config_overrides:
  reward:
    w1: 0.58
    w2: 0.55
    w3: 2.40
    w4: 0.035
    w5: 0.00
    stop_lambda: 0.05
    competition_margin_weight: 0.10
    competition_margin_radius_um: 20.0
    competition_margin_clip: 5.0
    competition_margin_affects_stop: false
  shape_prior:
    weight: 0.45
  stopping:
    moving_avg_window: 10
    patience: 5

run:
  name: colorectal_nucleus_based_patch_overfit4
  output_root: runs
  seed: 7
  device: cuda
  rollout_devices:
    - cuda:0
    - cuda:1
    - cuda:2
    - cuda:3
  rollout_worker_mode: process
  batch_patches: 16
  max_updates: 500
  policy_mode: sample
  vf_coef: 0.0
  warm_start_checkpoint: ""

patch_training:
  patches_index_path: runs/colorectal_nucleus_based_patch_episode_build/colorectal_nucleus_based_patches_overfit4_64um_index.csv
  # Keep the controlled overfit run bounded while preserving the same
  # positive global-delta REPLACE transition semantics.
  max_steps_per_patch: 16
  margin_cells_compete: true
  use_core_cells_for_score: true
  score_normalization: mean_expression_bins
  force_fill_expression_bins: true
  fill_target: reachable_expression_bins
  stop_action_mode: auto_no_improve_after_filled
  # EM already owns every reachable bin. Use the existing sequential
  # multi-cell global-delta REPLACE mode so only positive ambiguous-bin
  # replacements are exposed; joint random proposals otherwise roll back the
  # complete first macro-step and produce zero GRPO rank signal.
  agent_mode: multi_cell_global_delta
  after_fill_actions: replace_only
  global_delta_epsilon: 1.0e-6
  competition_margin_enabled: false
  rollout_backend: torch_gpu
  cache_patch_contexts: true

em_assignment:
  enabled: true
  # Resolved from the episode-build environment.max_center_distance_um.
  # reward.r_max_um is not used as the candidate radius.
  use_existing_rl_candidate_max_distance: true
  bin_universe:
    non_nuclear_filter: all
  background:
    enabled: false
    owned_logit_intercept: -6.0
    expression_confidence_weight: 12.0
  spatial_weight: 1.0
  expression_weight: 0.25
  damping: 0.5
  max_iterations: 15
  convergence:
    top_owner_change_fraction: 0.01
    mean_probability_change: 0.001
    mean_profile_total_variation: 0.001
  cell_specific_expression:
    # Opt in after validation; false preserves the original q @ LL behavior.
    enabled: false
    relative_prior_strength: 1.0
    profile_update_damping: 1.0
    compatibility_mode: standard
    # Used only when compatibility_mode is spatial_block_crossfit.
    spatial_crossfit_block_size_um: 8.0
    # Default preserves the previous nuclear-UMI-depth reliability rule.
    reliability_mode: nuclear_depth
    heldout_reliability_grid_size: 101
  ambiguity:
    # Initial experimental value; calibrate against pseudo ground truth.
    entropy_threshold: 0.50
  rl_integration:
    initialize_from_em: true
    lock_nuclear_bins: true
    refine_ambiguous_only: true
  artifacts:
    save: false
    debug_patch_ids: []
